name: CI Governance & Benchmark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Evaluation Benchmark Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install Dependencies
      run: |
        uv sync --group dev

    - name: Run Unit Governance Tests
      run: |
        uv run pytest tests/unit -v

    - name: Run Quantitative Evaluation Benchmark Gate
      run: |
        uv run python tests/eval/eval_benchmark.py

    - name: Verify 100% Evaluation Score
      run: |
        cat tests/eval/eval_results.json
