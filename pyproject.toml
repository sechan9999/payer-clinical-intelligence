[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payer-clinical-intelligence"
version = "0.1.0"
description = "Two governed AI agents (Payer Intelligence + Clinical & Growth) over one auditable RAG layer — demo-scale, production-shaped."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "google-genai>=0.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opencv-python>=5.0.0.93",
    "imageio>=2.37.4",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
