[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-ops-fleet"
version = "0.1.0"
description = "Governed multi-agent back-office fleet on Gemini 3.5 + ADK over an auditable RAG layer for Healthcare Payer & Clinical workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "google-genai>=0.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
