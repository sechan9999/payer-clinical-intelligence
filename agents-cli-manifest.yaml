version: "1.0"
manifest_type: "a2a_agent_fleet"
fleet_name: "payer-clinical-intelligence"
display_name: "Payer Clinical Intelligence Fleet"
description: "Two governed AI agents (Payer Intelligence + Clinical & Growth) over one auditable RAG layer — demo-scale, production-shaped."
protocol_version: "0.2.0"

agents:
  - id: "payer_intelligence"
    name: "Payer Intelligence Agent"
    version: "1.2.0"
    domain: "payer"
    autonomy_grade: "drafts_only"
    capabilities:
      - "query_payer_policies"
      - "analyze_denial_reasons"
      - "verify_coverage_eligibility"
      - "queue_prior_auth_request"

  - id: "clinical_growth"
    name: "Clinical & Growth Agent"
    version: "1.2.0"
    domain: "clinical"
    autonomy_grade: "drafts_only"
    capabilities:
      - "query_clinical_guidelines"
      - "evaluate_care_gaps"
      - "summarize_clinical_history"
      - "queue_growth_initiative"

  - id: "coordinator"
    name: "Fleet Coordinator Agent"
    version: "1.0.0"
    domain: "cross_domain"
    autonomy_grade: "read_only"
    capabilities:
      - "route_query"

governance_contracts:
  identity_derivation: "server_side_x_fleet_token_header"
  sql_pre_filtering: "true"
  human_approval_gate: "true"
  audit_logging: "append_only_sqlite_cloudsql"
